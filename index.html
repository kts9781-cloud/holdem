<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>헤즈업 홀덤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --room:#170b0e; --room-2:#35141c;
  --felt:#0f4a3f; --felt-hi:#1a6852; --felt-deep:#082a23;
  --rail:#2a1611; --brass:#cda65e; --brass-dim:rgba(205,166,94,.32);
  --ivory:#f4eddc; --ink:#1c1714; --red:#b2261d;
  --signal:#86e3c8; --signal-dim:rgba(134,227,200,.22); --neg:#ec7466; --led:#ff5a3c;
  --text:#f1e7d6; --muted:#bfae98;
  --display:"DM Serif Display", Georgia, "Times New Roman", serif;
  --sans:"IBM Plex Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --digital:"Share Tech Mono", "IBM Plex Mono", ui-monospace, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{background:var(--room)}
body{margin:0; min-height:100vh; min-height:100dvh; color:var(--text); font:15px/1.5 var(--sans);
  background:radial-gradient(90% 60% at 50% -10%, var(--room-2), transparent 70%), var(--room);
  padding:env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); position:relative; isolation:isolate}
/* 방 배경 사진 (Higgsfield 생성). 글자가 읽히도록 위아래를 어둡게 덮는다 */
body::before{content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:linear-gradient(180deg, rgba(23,11,14,.62), rgba(23,11,14,.3) 35%, rgba(23,11,14,.55) 70%, rgba(23,11,14,.92)),
    url("assets/room.jpg") center / cover no-repeat}
button{font:inherit; color:inherit; cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--signal); outline-offset:3px}

.top{max-width:1160px; margin:0 auto; padding:18px 16px 12px; display:flex; align-items:baseline; justify-content:space-between; gap:6px 16px; flex-wrap:wrap}
.top h1{margin:0; font-size:20px; font-weight:700; letter-spacing:-.02em}
.top h1 .spade{color:var(--brass); margin-right:6px}
.top h1 small{font-weight:400; color:var(--muted); font-size:13px; margin-left:8px; letter-spacing:0}
.top .meta{font:13px var(--mono); color:var(--muted); display:flex; flex-wrap:wrap; gap:4px 14px}
.linkbtn{padding:0; border:0; background:none; font:inherit; color:var(--muted); text-decoration:underline; text-underline-offset:3px}
.linkbtn[aria-pressed="false"]{opacity:.55}
.linkbtn.warn{color:var(--neg)}
#blinds.bump{animation:pop .4s ease-out; color:var(--brass)}

.layout{max-width:1160px; margin:0 auto; padding:0 16px 40px; display:grid; gap:22px}
@media (min-width:880px){ .layout{grid-template-columns:minmax(0,1fr) 340px; align-items:start} }

/* ===== 테이블: 좌석을 둘레에 배치 ===== */
.table{position:relative; isolation:isolate; margin:14px 12px 18px; aspect-ratio:3/4; --chip:24px;
  border-radius:clamp(56px, 16vw, 190px);
  /* 실제 울 펠트 사진 (Higgsfield 생성) 위에 천장 조명처럼 가운데를 밝히고 가장자리를 어둡게 */
  background:radial-gradient(ellipse 60% 50% at 50% 45%, rgba(120,230,190,.16), transparent 70%),
    radial-gradient(ellipse 75% 70% at 50% 50%, transparent 45%, rgba(3,18,14,.6)),
    url("assets/felt.jpg") center / cover, var(--felt);
  box-shadow:0 0 0 10px var(--rail), 0 0 0 11px var(--brass-dim), 0 0 0 13px #120806, 0 28px 60px rgba(0,0,0,.55), inset 0 0 70px rgba(0,0,0,.5)}
.table::before{content:""; position:absolute; inset:12px; z-index:-1; border-radius:inherit; border:1px solid rgba(205,166,94,.2); pointer-events:none}
@media (min-width:700px){ .table{aspect-ratio:16/10; --chip:28px} .table[data-n="2"]{aspect-ratio:16/11} }

.seat{position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:3px; width:max-content; z-index:2}
.seat.me{transform:translate(-50%,-100%); gap:6px}
.seat.me .info{order:-1} /* 나: 액션 → 카드 → 명패 */
.plate{position:relative; display:flex; flex-direction:column; align-items:center; min-width:74px; padding:3px 10px 4px; border-radius:12px;
  background:rgba(8,18,15,.78); border:1px solid var(--brass-dim); transition:box-shadow .3s, opacity .3s; line-height:1.2}
.plate .name{font-weight:600; font-size:12px; white-space:nowrap}
.plate .stack{font:16px/1.1 var(--display); color:var(--ivory); font-weight:400}
.seat.me .plate{flex-direction:row; gap:10px; padding:5px 14px; border-radius:999px}
.seat.me .plate .name{font-size:14px}
.seat.me .plate .stack{font-size:20px}
.table[data-n="2"] .seat.ai .plate{flex-direction:row; gap:10px; padding:5px 14px; border-radius:999px}
.table[data-n="2"] .seat.ai .plate .name{font-size:14px}
.table[data-n="2"] .seat.ai .plate .stack{font-size:20px}
.seat.turn .plate{box-shadow:0 0 0 2px var(--brass), 0 0 22px rgba(205,166,94,.5)}
.seat.ai.turn .plate{box-shadow:0 0 0 2px var(--signal), 0 0 22px rgba(134,227,200,.45)}
.seat.win .plate{box-shadow:0 0 0 2px var(--brass), 0 0 30px rgba(205,166,94,.7)}
.seat.folded .plate{opacity:.55}
.seat.out{filter:grayscale(1) brightness(.5)}
.badge{position:absolute; top:-10px; right:-10px; padding:1px 8px; border-radius:999px; background:var(--neg); color:#2a0d0a; font:700 12px/18px var(--sans); animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both; filter:none}
.hand{display:flex; gap:3px; --cw:26px; min-height:calc(var(--cw) * 1.4)}
.seat.ai .hand{margin-bottom:-12px; z-index:-1}
.seat.me .hand{--cw:clamp(44px, 12vw, 60px); gap:6px}
.table[data-n="2"] .seat.ai .hand{--cw:42px; gap:5px; margin-bottom:0}
@media (min-width:700px){ .hand{--cw:34px} .seat.me .hand{--cw:66px} }
.info{display:flex; gap:8px; min-height:18px; font-size:12px; line-height:18px; white-space:nowrap}
.say{color:var(--ivory); font-weight:500; text-shadow:0 1px 3px rgba(0,0,0,.7)}
.say.pop{animation:pop .3s ease-out}
.hname{color:var(--brass); text-shadow:0 1px 3px rgba(0,0,0,.7)}
.bio{position:absolute; top:calc(100% + 4px); left:50%; transform:translateX(-50%); width:180px; padding:8px 10px; border-radius:10px; z-index:9;
  background:rgba(8,12,11,.95); border:1px solid var(--brass-dim); font-size:12px; line-height:1.5; color:var(--muted); white-space:normal; animation:pop .2s ease-out}
.bio b{display:block; color:var(--text); font-size:13px}

.timechip{position:absolute; right:-54px; bottom:4px; width:44px; height:44px; border-radius:50%; border:0; padding:0;
  background:radial-gradient(circle, #f2e8d2 0 40%, transparent 41%), repeating-conic-gradient(var(--brass) 0 20deg, #7a5a1e 20deg 40deg);
  box-shadow:0 3px 8px rgba(0,0,0,.5), inset 0 0 0 3px rgba(0,0,0,.25); color:#3a2608; font:700 11px/1 var(--sans)}
.timechip span{position:absolute; top:-6px; right:-6px; min-width:18px; height:18px; border-radius:9px; background:var(--neg); color:#2a0d0a; font:700 11px/18px var(--sans)}
.timechip:disabled{filter:grayscale(.8) brightness(.6)}

.bet{position:absolute; transform:translate(-50%,-50%); display:inline-flex; align-items:flex-end; gap:5px; font:12px var(--mono); z-index:1}
.bet b{font-weight:500; padding:0 7px; border-radius:999px; background:rgba(0,0,0,.5); line-height:18px}
.bet.off{visibility:hidden}
.bet.r{flex-direction:row-reverse} /* 오른쪽 좌석은 금액을 칩 왼쪽에 → 자기 명패를 가리지 않게 */
/* 칩: Higgsfield 3D 칩 모델을 금액별로 색을 바꾸고 숫자를 새겨 테이블 시점으로 미리 렌더한 스프라이트를 쌓는다 */
.chipset{display:inline-flex; align-items:flex-end; gap:1px}
.chips{position:relative; flex:none; width:var(--chip)}
.chips img{position:absolute; width:var(--chip); filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}

.dealer-btn{position:absolute; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%; background:var(--ivory); color:var(--ink); z-index:3;
  font:13px/22px var(--display); text-align:center; box-shadow:0 2px 5px rgba(0,0,0,.5); transition:left .6s cubic-bezier(.3,.8,.3,1), top .6s cubic-bezier(.3,.8,.3,1)}

.center{position:absolute; left:50%; top:43%; transform:translate(-50%,-50%); display:grid; justify-items:center; gap:6px; z-index:1}
.table[data-n="2"] .center{top:46%}
.board-wrap{position:relative; --cw:clamp(30px, 9.2vw, 46px)}
.table[data-n="2"] .board-wrap{--cw:clamp(40px, 12vw, 64px)}
@media (min-width:700px){ .board-wrap{--cw:54px} }
.slots,.board{display:flex; gap:4px}
.board{position:absolute; inset:0}
.slot{width:var(--cw); aspect-ratio:5/7; border-radius:calc(var(--cw) * .1); border:1px dashed rgba(244,237,220,.16)}
.pot{display:flex; align-items:flex-end; gap:6px; font-size:12px; line-height:22px; color:var(--muted); min-height:30px}
.pot b{font:22px/1 var(--display); font-weight:400; color:var(--brass)}
.banner{text-align:center; animation:pop .35s ease-out; max-width:240px}
.banner strong{display:block; font-size:18px; line-height:1.25; font-weight:700}
.banner span{font:12px var(--mono); color:var(--muted)}
.banner.win strong{color:var(--brass)}
.banner.lose strong{color:var(--neg)}
/* 디지털 샷클락 */
.clock{font:26px/1 var(--digital); letter-spacing:.06em; color:#ffd9a0; padding:3px 10px 2px; border-radius:6px; background:rgba(0,0,0,.55);
  box-shadow:inset 0 0 0 1px rgba(255,200,120,.25); text-shadow:0 0 8px rgba(255,190,90,.8); visibility:hidden}
.clock.on{visibility:visible}
.clock.hurry{color:#ffb3a6; text-shadow:0 0 10px var(--led), 0 0 2px var(--led); animation:blink 1s steps(2) infinite}
.level-banner{position:absolute; left:50%; top:20%; transform:translate(-50%,-50%); z-index:6; padding:8px 18px; border-radius:12px; text-align:center;
  background:rgba(20,10,6,.92); border:1px solid var(--brass); color:var(--brass); font:700 15px/1.4 var(--sans); white-space:nowrap; animation:banner 2.4s ease both}
.level-banner small{display:block; font:12px var(--mono); color:var(--muted)}
#deck{position:absolute; left:50%; top:4%; width:1px; height:1px}

/* 카드 */
.card{position:relative; flex:none; width:var(--cw); aspect-ratio:5/7; border-radius:calc(var(--cw) * .1);
  background:linear-gradient(165deg, #fffaf0, var(--ivory) 55%, #e4d9c0); color:var(--ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 4px 10px rgba(0,0,0,.4);
  font-family:var(--display); transition:transform .25s, filter .25s, box-shadow .25s}
.card.red{color:var(--red)}
.card .idx{position:absolute; top:4%; left:7%; display:flex; flex-direction:column; align-items:center; font-size:calc(var(--cw) * .44); line-height:.95; letter-spacing:-.05em}
.card .idx small{font:calc(var(--cw) * .29)/1 var(--sans)}
.card .pip{position:absolute; right:7%; bottom:4%; font:calc(var(--cw) * .62)/1 var(--sans)}
.card.back{background:
  repeating-linear-gradient(45deg, rgba(205,166,94,.28) 0 1px, transparent 1px 7px),
  repeating-linear-gradient(-45deg, rgba(205,166,94,.28) 0 1px, transparent 1px 7px), #5c1823;
  box-shadow:inset 0 0 0 2px var(--ivory), inset 0 0 0 3px var(--brass), 0 4px 10px rgba(0,0,0,.4)}
.card.undealt{visibility:hidden}
.card.deal{animation:deal .38s cubic-bezier(.2,.9,.25,1) both}
.card.flip{animation:flip .45s ease-out both}
.card.win{transform:translateY(-5px); box-shadow:0 0 0 2px var(--brass), 0 10px 20px rgba(0,0,0,.5)}
.card.dim{filter:brightness(.5) saturate(.5)}
#fx{position:fixed; inset:0; pointer-events:none; z-index:60; overflow:hidden}
.flyer{position:fixed; left:0; top:0; will-change:transform}

/* 조작 */
.controls{display:grid; gap:10px}
#actions{display:grid; gap:10px}
.main{display:grid; grid-template-columns:1fr 1.15fr 1.45fr; gap:8px}
.btn{min-height:54px; padding:0 10px; border-radius:14px; border:1px solid var(--brass-dim); background:rgba(0,0,0,.28); font-weight:600; font-size:16px; transition:transform .12s, background .2s, opacity .2s}
.btn:not(:disabled):hover{background:rgba(205,166,94,.12)}
.btn:not(:disabled):active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg, #e0bd75, #b98f44); color:#2a1707; border-color:transparent}
.btn.primary:not(:disabled):hover{background:linear-gradient(180deg, #ebc982, #c49a4e)}
.btn.ghost{background:transparent; color:var(--muted)}
.btn:disabled{opacity:.36}
.btn small{display:block; font-size:12px; font-weight:500; opacity:.7}
.btn.wide{width:100%}
.sizing{display:grid; gap:8px}
.presets{display:flex; gap:6px}
.presets .chip{flex:1; min-width:0; padding:0 4px}
.fine{display:flex; align-items:center; gap:8px}
.chip{min-height:42px; padding:0 12px; border-radius:999px; border:1px solid var(--brass-dim); background:transparent; color:var(--muted); font-size:15px; font-weight:500; font-variant-numeric:tabular-nums}
.chip.on{border-color:var(--brass); background:rgba(205,166,94,.16); color:var(--text)}
.chip.step{width:44px; padding:0; font-size:18px; line-height:1}
.chip:disabled{opacity:.36}
.fine input{flex:1; min-width:0; height:36px; accent-color:var(--brass)}

/* EV 계기판 */
.side{display:grid; gap:18px; align-content:start}
.gauge{position:relative; overflow:hidden; padding:16px; border-radius:16px;
  background:linear-gradient(180deg, #0d1917, #08100f); border:1px solid var(--signal-dim);
  color:var(--signal); font-family:var(--mono); box-shadow:0 20px 40px rgba(0,0,0,.35)}
.gauge::before{content:""; position:absolute; inset:0; pointer-events:none; background:repeating-linear-gradient(0deg, rgba(134,227,200,.035) 0 1px, transparent 1px 3px)}
.g-head{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap}
.g-head h2{margin:0; font:600 13px var(--sans); letter-spacing:.08em}
.g-head h2 span{color:var(--text); font-weight:500; letter-spacing:0; margin-left:6px}
.state{display:inline-flex; align-items:center; gap:6px; padding:2px 8px; border-radius:999px; border:1px solid var(--signal-dim); font-size:11px}
.state::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.45}
.state.busy::before{opacity:1; animation:blink .6s steps(2) infinite}
.toggle{margin-left:auto; display:flex; align-items:center; gap:6px; font:12px var(--sans); color:var(--muted); cursor:pointer}
.toggle input{accent-color:var(--signal); margin:0}
.secret{position:relative; min-height:120px}
.gauge.sealed .secret{visibility:hidden}
.gauge.sealed .secret::after{content:"이번 핸드가 끝나면 공개돼요"; visibility:visible; position:absolute; inset:0; display:grid; place-items:center;
  font:13px var(--sans); color:var(--muted); border:1px dashed var(--signal-dim); border-radius:10px;
  background:repeating-linear-gradient(-45deg, rgba(134,227,200,.06) 0 8px, transparent 8px 16px) 0 0/200% 200%; animation:drift 8s linear infinite}
.empty{margin:0; font:13px/1.7 var(--sans); color:var(--muted)}
.eq{display:flex; align-items:baseline; gap:10px}
.eq b{font-size:34px; line-height:1; font-weight:500; color:#d6fff2}
.k{font-size:12px; color:rgba(134,227,200,.7)}
.eq .tag{margin-left:auto}
.tag{padding:1px 8px; border-radius:999px; background:var(--brass); color:#2a1707; font:600 11px/18px var(--sans)}
.meter{position:relative; height:10px; margin:12px 0 28px; border-radius:5px; background:rgba(134,227,200,.1)}
.meter i{position:absolute; inset:0 auto 0 0; border-radius:inherit; background:linear-gradient(90deg, rgba(134,227,200,.45), var(--signal)); animation:grow .8s cubic-bezier(.2,.8,.2,1)}
.meter em{position:absolute; top:-4px; bottom:-4px; width:2px; margin-left:-1px; background:var(--brass)}
.meter em span{position:absolute; top:18px; left:0; transform:translateX(-50%); white-space:nowrap; font:normal 11px var(--mono); color:var(--brass)}
.meta{display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:6px 14px; margin:0 0 14px; font-size:12px}
.meta div{display:flex; justify-content:space-between; gap:8px; padding-bottom:4px; border-bottom:1px solid rgba(134,227,200,.08)}
.meta dt{font-family:var(--sans); color:rgba(134,227,200,.65)}
.meta dd{margin:0}
.evs{list-style:none; margin:0; padding:0; display:grid; gap:4px}
.evs li{display:grid; grid-template-columns:minmax(0,1.8fr) 1fr 4.4em; align-items:center; gap:10px; padding:6px 8px; border-radius:8px; font-size:12.5px}
.evs li.on{background:rgba(134,227,200,.08); box-shadow:inset 0 0 0 1px var(--signal)}
.evs li > span{font-family:var(--sans); color:var(--text)}
.evs small{display:block; font:11px var(--mono); color:var(--muted)}
.evs small i{font-style:normal; white-space:nowrap}
.evs b{text-align:right; font-weight:500}
.evs b.neg{color:var(--neg)}
.bar{position:relative; height:8px}
.bar::before{content:""; position:absolute; left:50%; top:-3px; bottom:-3px; width:1px; background:rgba(134,227,200,.3)}
.bar i{position:absolute; top:0; bottom:0; left:50%; border-radius:0 3px 3px 0; background:var(--signal); transform-origin:left; animation:growx .7s cubic-bezier(.2,.8,.2,1)}
.bar i.neg{left:auto; right:50%; border-radius:3px 0 0 3px; background:var(--neg); transform-origin:right}
.pick{display:flex; justify-content:space-between; gap:10px; margin-top:12px; padding-top:12px; border-top:1px solid rgba(134,227,200,.12); font-size:13px}
.pick:empty{display:none}
.pick span{font-family:var(--sans); color:var(--muted)}

/* 전적·기록 */
.log{padding:14px 16px; border-radius:16px; background:rgba(16,8,10,.62); border:1px solid rgba(205,166,94,.14); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px)}
.log h2{margin:0 0 8px; font:600 13px var(--sans); letter-spacing:.08em; color:var(--muted)}
.log ol{list-style:none; margin:0; padding:0; max-height:220px; overflow:auto; font-size:13px}
@media (min-width:880px){ .log ol{max-height:320px} }
.log li{padding:1px 0}
.log li.head{margin-top:10px; font:12px var(--mono); color:var(--brass)}
.log li.head:first-child{margin-top:0}
.log li.street{color:var(--muted)}
.log li.result{font-weight:600}
.log li.level{color:var(--brass); font-weight:600}
.record dl{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin:0}
.record dt{font-size:12px; color:var(--muted)}
.record dd{margin:2px 0 0; font:20px/1.2 var(--display); color:var(--ivory)}
.record dd small{margin-left:6px; font:12px var(--mono); color:var(--muted)}
.prof{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-top:12px; padding-top:10px; border-top:1px solid rgba(205,166,94,.14); font-size:12px; line-height:1.5; color:var(--muted)}
.prof .linkbtn{flex:none; font-size:12px}

/* 로비·결과 모달 */
.overlay{position:fixed; inset:0; z-index:40; display:grid; place-items:center; padding:24px 16px; background:rgba(12,5,7,.72); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px)}
.sheet{width:min(420px, 100%); padding:26px 22px; border-radius:20px; background:linear-gradient(180deg, #24120f, #150a0a); border:1px solid var(--brass-dim);
  box-shadow:0 30px 80px rgba(0,0,0,.6); animation:rise .45s cubic-bezier(.2,.9,.3,1) both}
.sheet h2{margin:0 0 4px; font:28px/1.2 var(--display); font-weight:400; color:var(--brass); text-align:center}
.sheet > p{margin:0 0 18px; text-align:center; color:var(--muted); font-size:14px}
.modes{display:grid; gap:10px}
.mode{display:grid; gap:2px; text-align:left; padding:14px 16px; border-radius:14px; border:1px solid var(--brass-dim); background:rgba(0,0,0,.25)}
.mode:hover{background:rgba(205,166,94,.1); border-color:var(--brass)}
.mode b{font-size:17px}
.mode span{font-size:13px; color:var(--muted)}

@keyframes deal{from{opacity:0; transform:translateY(-26px) rotate(-8deg) scale(.92)}}
@keyframes flip{from{transform:perspective(600px) rotateY(90deg)}}
@keyframes pop{from{opacity:0; transform:translateY(4px)}}

@keyframes banner{0%{opacity:0; transform:translate(-50%,-30%) scale(.9)} 12%,80%{opacity:1; transform:translate(-50%,-50%) scale(1)} 100%{opacity:0; transform:translate(-50%,-60%)}}
@keyframes rise{from{opacity:0; transform:translateY(24px) scale(.97)}}
@keyframes grow{from{width:0}}

@keyframes blink{50%{opacity:.35}}
@keyframes drift{to{background-position:100% 100%}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}
}

<body>

<script id="engine">
// ===== 엔진: DOM 없음. 좌석 0 = 나, 나머지 = AI. 헤즈업은 2명인 경우 =====
let ITERS = 2000; // 몬테카를로 반복 횟수 (상대가 많으면 줄여 쓴다)
const CHIP = 100; // 가장 작은 칩. 모든 금액은 100 단위
// 실제 토너먼트처럼 오르는 블라인드
const LEVELS = [[100, 200], [200, 400], [300, 600], [400, 800], [500, 1000], [600, 1200], [800, 1600], [1000, 2000], [1200, 2400],
  [1500, 3000], [2000, 4000], [2500, 5000], [3000, 6000], [4000, 8000], [5000, 10000], [6000, 12000], [8000, 16000], [10000, 20000]];
// 블라인드 레벨은 G.level. 실제 대회처럼 화면의 토너먼트 시계가 시간으로 올린다 (엔진은 시간을 모른다)
const RANKS = '23456789TJQKA', SUITS = 'shdc', SUIT_GLYPH = '♠♥♦♣';
const rankOf = c => c >> 2, suitOf = c => c & 3;
const card = s => RANKS.indexOf(s[0]) * 4 + SUITS.indexOf(s[1]);
const rankLabel = r => r === 8 ? '10' : RANKS[r];
const cardText = c => rankLabel(rankOf(c)) + SUIT_GLYPH[suitOf(c)];
const fmt = n => n.toLocaleString('ko-KR');
const sum = a => a.reduce((s, x) => s + x, 0);
const HAND_NAMES = ['하이카드', '원페어', '투페어', '트리플', '스트레이트', '플러시', '풀하우스', '포카드', '스트레이트 플러시'];

// 랭크 비트마스크에서 스트레이트 최고 랭크 (없으면 -1). A-5 휠은 3('5') 반환.
function straightHigh(m) {
  const w = (m << 1) | ((m >> 12) & 1);
  for (let h = 13; h >= 4; h--) if (((w >> (h - 4)) & 31) === 31) return h - 1;
  return -1;
}

// 5~7장 → 비교 가능한 정수 (클수록 강함). 족보 × 13^5 + 키커 5개.
function evaluate(cs) {
  const rc = new Array(13).fill(0), sc = [0, 0, 0, 0], sm = [0, 0, 0, 0];
  let mask = 0;
  for (const c of cs) { const r = c >> 2, s = c & 3; rc[r]++; sc[s]++; sm[s] |= 1 << r; mask |= 1 << r; }
  const score = (cat, ks) => { let v = cat; for (let i = 0; i < 5; i++) v = v * 13 + (ks[i] ?? 0); return v; };
  // 7장 이하에서 플러시가 있으면 포카드·풀하우스는 불가능하므로 먼저 확인해도 된다
  for (let s = 0; s < 4; s++) if (sc[s] >= 5) {
    const h = straightHigh(sm[s]);
    if (h >= 0) return score(8, [h]);
    const ks = [];
    for (let r = 12; r >= 0 && ks.length < 5; r--) if ((sm[s] >> r) & 1) ks.push(r);
    return score(5, ks);
  }
  const g = [[], [], [], [], []];
  for (let r = 12; r >= 0; r--) g[rc[r]].push(r);
  const [, , pairs, trips, quads] = g;
  const kick = (ex, n) => { const k = []; for (let r = 12; r >= 0 && k.length < n; r--) if (rc[r] && !ex.includes(r)) k.push(r); return k; };
  if (quads.length) return score(7, [quads[0], ...kick([quads[0]], 1)]);
  if (trips.length && (trips.length > 1 || pairs.length)) return score(6, [trips[0], Math.max(trips[1] ?? -1, pairs[0] ?? -1)]);
  const st = straightHigh(mask);
  if (st >= 0) return score(4, [st]);
  if (trips.length) return score(3, [trips[0], ...kick([trips[0]], 2)]);
  if (pairs.length > 1) return score(2, [pairs[0], pairs[1], ...kick(pairs.slice(0, 2), 1)]);
  if (pairs.length) return score(1, [pairs[0], ...kick([pairs[0]], 3)]);
  return score(0, kick([], 5));
}

function handName(score) {
  const cat = Math.floor(score / 13 ** 5);
  return cat === 8 && Math.floor(score / 13 ** 4) % 13 === 12 ? '로열 플러시' : HAND_NAMES[cat];
}

// 7장 중 최고의 5장 (쇼다운 하이라이트용)
function best5(cs) {
  let best = null;
  for (let a = 0; a < cs.length; a++) for (let b = a + 1; b < cs.length; b++) {
    const five = cs.filter((_, i) => i !== a && i !== b), s = evaluate(five);
    if (!best || s > best.score) best = { score: s, cards: five };
  }
  return best;
}

// 첸 공식 → 1326개 스타팅 핸드의 백분위 (0 = 최약, 1 = 최강)
function chen(a, b) {
  let r1 = a >> 2, r2 = b >> 2;
  if (r1 < r2) [r1, r2] = [r2, r1];
  const base = r => r === 12 ? 10 : r === 11 ? 8 : r === 10 ? 7 : r === 9 ? 6 : (r + 2) / 2;
  let s = base(r1);
  if (r1 === r2) return Math.max(5, s * 2);
  if ((a & 3) === (b & 3)) s += 2;
  const gap = r1 - r2 - 1;
  s -= [0, 1, 2, 4][gap] ?? 5;
  if (gap <= 1 && r1 < 10) s += 1;
  return Math.ceil(s);
}
// [카드a, 카드b, 값] 목록 → 핸드별 백분위 표 (동점은 같은 백분위)
function percentiles(l) {
  const out = new Float32Array(52 * 52);
  l.sort((x, y) => x[2] - y[2]);
  let first = 0;
  l.forEach(([a, b, v], i) => { if (i && v !== l[i - 1][2]) first = i; out[a * 52 + b] = out[b * 52 + a] = first / l.length; });
  return out;
}
const PCT = (() => { const l = []; for (let a = 0; a < 52; a++) for (let b = 0; b < a; b++) l.push([a, b, chen(a, b)]); return percentiles(l); })();
// 상대 레인지 강도표: 프리플랍은 첸 백분위, 플랍부터는 보드 위 현재 족보(65%) + 프리플랍(35%)을 섞어 다시 백분위로
// ponytail: 드로우는 족보로 안 잡혀서 과소평가된다. 더 정교하게 하려면 아웃츠 가중치를 더할 것
function strengthMap(board, dead) {
  if (!board.length) return PCT;
  const l = [];
  for (let a = 0; a < 52; a++) for (let b = 0; b < a; b++) if (!dead.has(a) && !dead.has(b)) l.push([a, b, evaluate([a, b, ...board])]);
  const made = percentiles(l);
  return percentiles(l.map(([a, b]) => [a, b, 0.65 * made[a * 52 + b] + 0.35 * PCT[a * 52 + b]]));
}
// 상대 레인지 컷: 팟 크기 레이즈(공격 강도 1) 한 번이면 "상대가 레이즈하는 빈도(rr)"만큼의 상위 핸드로 좁힌다.
// 아무 패로나 레이즈하는 상대(rr≈1)는 거의 안 좁히고, 골라서 레이즈하는 상대는 크게 좁힌다. 상위 10%보다는 안 좁힌다
const rangeCut = (aggro, rr) => Math.min(0.9, 1 - rr ** aggro);

// 몬테카를로 승률: 상대마다 각자 레인지(강도표에서 cuts[k] 이상)에서 패를 뽑고, 남은 보드는 무작위로. 동점은 나눠 가진다
// 거절 표본추출은 상대별로 따로 (한꺼번에 거절하면 상대가 많을 때 통과율이 곱으로 줄어든다)
function equity(hole, board, cuts, map = PCT, iters = ITERS) {
  const dead = new Set([...hole, ...board]), d = [];
  for (let c = 0; c < 52; c++) if (!dead.has(c)) d.push(c);
  const n = d.length, need = 5 - board.length, me = [...hole, ...board], opp = cuts.map(() => [0, 0, ...board]);
  const rnd = k => Math.floor(Math.random() * k);
  const swap = (i, j) => { const t = d[i]; d[i] = d[j]; d[j] = t; };
  let won = 0;
  for (let it = 0; it < iters; it++) {
    let pos = 0;
    for (let k = 0; k < cuts.length; k++, pos += 2) {
      let tries = 0;
      do { swap(pos, pos + rnd(n - pos)); swap(pos + 1, pos + 1 + rnd(n - pos - 1)); }
      while (cuts[k] > 0 && map[d[pos] * 52 + d[pos + 1]] < cuts[k] && ++tries < 60);
      opp[k][0] = d[pos]; opp[k][1] = d[pos + 1];
    }
    for (let j = 0; j < need; j++) swap(pos + j, pos + j + rnd(n - pos - j));
    const run = d.slice(pos, pos + need), mine = evaluate(me.concat(run));
    let ties = 0, lost = false;
    for (const o of opp) { const s = evaluate(o.concat(run)); if (s > mine) { lost = true; break; } if (s === mine) ties++; }
    if (!lost) won += 1 / (ties + 1);
  }
  return won / iters;
}

// ===== 게임 상태 =====
let G, H;
// opts: names[], styles[], stacks[]
function newGame(o) {
  const n = o.stacks.length;
  // stats: 베팅을 마주한 횟수, 폴드 횟수, 그때마다의 MDF(최소 방어 빈도) 합, 레이즈할 수 있었던 횟수, 실제 레이즈 횟수
  G = { n, names: o.names, styles: o.styles, stacks: o.stacks.slice(), out: Array(n).fill(false), place: Array(n).fill(null),
        level: 0, hand: 0, button: Math.floor(Math.random() * n),
        stats: Array.from({ length: n }, () => ({ faced: 0, folded: 0, mdf: 0, chances: 0, raises: 0 })) };
}
const alive = () => G.stacks.map((_, i) => i).filter(i => !G.out[i]);
const nextOf = (from, ok) => { for (let k = 1; k <= G.n; k++) { const i = (from + k) % G.n; if (ok(i)) return i; } return -1; };
const live = () => H.folded.map((f, i) => f ? -1 : i).filter(i => i >= 0); // 이번 핸드에서 아직 안 접은 사람
const maxBet = () => Math.max(...H.bets);
const needsAction = i => !H.folded[i] && G.stacks[i] > 0 && (!H.acted[i] || H.bets[i] < maxBet());
function put(p, x) { x = Math.min(x, G.stacks[p]); G.stacks[p] -= x; H.bets[p] += x; H.committed[p] += x; }

function newHand() {
  if (G.hand) G.button = nextOf(G.button, i => !G.out[i]);
  G.hand++;
  const n = G.n, [sb, bb] = LEVELS[Math.min(G.level, LEVELS.length - 1)], d = [...Array(52).keys()];
  for (let i = 51; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [d[i], d[j]] = [d[j], d[i]]; }
  const z = () => Array(n).fill(0);
  H = { deck: d, hole: Array.from({ length: n }, () => []), board: [], bets: z(), committed: z(), aggro: z(),
        folded: G.out.slice(), acted: Array(n).fill(false), canRaise: Array(n).fill(true),
        lastRaise: bb, sb, bb, start: G.stacks.slice(), result: null, decision: null, busted: [] };
  for (let r = 0; r < 2; r++) for (let k = 1; k <= n; k++) { const i = (G.button + k) % n; if (!G.out[i]) H.hole[i].push(d.pop()); } // 버튼 왼쪽부터 한 장씩
  // 헤즈업(2명)이면 버튼이 스몰 블라인드, 아니면 버튼 다음이 SB, 그다음이 BB
  H.sbSeat = alive().length === 2 ? G.button : nextOf(G.button, i => !G.out[i]);
  H.bbSeat = nextOf(H.sbSeat, i => !G.out[i]);
  put(H.sbSeat, sb); put(H.bbSeat, bb);
  H.toAct = nextOf(H.bbSeat, needsAction); // 프리플랍은 BB 다음 사람부터 (헤즈업이면 버튼=SB)
}
function legal(p) {
  const mb = maxBet(), owe = mb - H.bets[p];
  const cap = Math.max(0, ...live().filter(i => i !== p).map(i => H.bets[i] + G.stacks[i])); // 아무도 못 받는 만큼은 의미 없음
  const maxTo = Math.min(H.bets[p] + G.stacks[p], cap);
  return { toCall: Math.min(owe, G.stacks[p]), canCheck: owe === 0, canRaise: H.canRaise[p] && maxTo > mb,
           minTo: Math.min(mb + H.lastRaise, maxTo), maxTo };
}
function act(p, type, to) {
  const mb = maxBet(), owe = mb - H.bets[p], before = G.stacks[p], st = G.stats[p], L = legal(p);
  if (owe > 0) { const P = sum(H.committed); st.faced++; st.mdf += (P - owe) / P; }
  if (L.canRaise) { st.chances++; if (type === 'raise') st.raises++; }
  let label;
  if (type === 'raise' && !L.canRaise) type = 'call'; // 레이즈할 수 없으면 콜로 처리
  if (type === 'fold') { st.folded++; H.folded[p] = true; label = '폴드'; }
  else if (type === 'raise') {
    to = Math.max(L.minTo, Math.min(L.maxTo, Math.round(to / CHIP) * CHIP));
    const inc = to - mb, full = inc >= H.lastRaise, verb = mb ? '레이즈' : '베팅';
    const s = inc / (sum(H.committed) + owe); // 공격 강도: 1/2팟 0.75, 팟 1, 큰 올인은 최대 4
    if (full) H.lastRaise = inc;
    // 최소 레이즈 이상이면 모두에게 액션이 다시 열리고, 모자란 올인이면 이미 행동한 사람은 콜/폴드만 할 수 있다
    for (const q of live()) if (q !== p && G.stacks[q] > 0) { if (full) H.canRaise[q] = true; else if (H.acted[q]) H.canRaise[q] = false; H.acted[q] = false; }
    put(p, to - H.bets[p]); H.aggro[p] += Math.min(4, 0.5 + s / 2);
    label = `${verb} ${fmt(H.bets[p])}`;
  } else { put(p, owe); label = owe ? `콜 ${fmt(before - G.stacks[p])}` : '체크'; }
  H.acted[p] = true;
  H.toAct = nextOf(p, needsAction);
  return type === 'fold' || G.stacks[p] ? label : `올인 · ${label}`;
}
function roundOver() {
  const lv = live();
  if (lv.length <= 1) return true;
  const canAct = lv.filter(i => G.stacks[i] > 0);
  // 칩이 남은 사람이 혼자이고 이미 최고 베팅을 맞췄다면 더 할 베팅이 없다
  if (lv.some(needsAction) && !(canAct.length === 1 && H.bets[canAct[0]] >= maxBet())) return false;
  const mb = maxBet(), top = H.bets.indexOf(mb), second = Math.max(0, ...H.bets.filter((_, i) => i !== top));
  if (mb > second) { const ex = mb - second; G.stacks[top] += ex; H.bets[top] -= ex; H.committed[top] -= ex; } // 아무도 받지 못한 초과분 반환
  return true;
}
function nextStreet() {
  const k = H.board.length ? 1 : 3;
  for (let i = 0; i < k; i++) H.board.push(H.deck.pop());
  H.bets.fill(0); H.acted.fill(false); H.canRaise.fill(true); H.lastRaise = H.bb;
  H.toAct = nextOf(G.button, needsAction); // 플랍부터는 버튼 다음 사람부터 (헤즈업이면 BB)
}
// 정산: 올인 금액 층마다 사이드팟을 나누고 층마다 승자를 가린다. 폴드한 사람이 낸 칩도 팟에 남는다
function settle() {
  const n = G.n, lv = live(), total = sum(H.committed), pots = [];
  if (lv.length === 1) pots.push({ amt: total, elig: lv });
  else {
    let prev = 0;
    for (const L of [...new Set(lv.map(i => H.committed[i]))].sort((a, b) => a - b)) {
      let amt = 0;
      for (let i = 0; i < n; i++) amt += Math.max(0, Math.min(H.committed[i], L) - prev);
      pots.push({ amt, elig: lv.filter(i => H.committed[i] >= L) }); prev = L;
    }
    pots[pots.length - 1].amt += total - sum(pots.map(p => p.amt)); // 폴드한 사람이 더 많이 낸 몫(드묾)
  }
  const score = lv.length > 1 ? Object.fromEntries(lv.map(i => [i, evaluate([...H.hole[i], ...H.board])])) : null;
  const order = Array.from({ length: n }, (_, k) => (G.button + 1 + k) % n); // 남는 칩은 버튼 왼쪽부터
  for (const pot of pots) {
    const best = score && Math.max(...pot.elig.map(i => score[i]));
    const win = score ? pot.elig.filter(i => score[i] === best) : pot.elig;
    const unit = Math.floor(pot.amt / CHIP / win.length) * CHIP;
    win.forEach(i => G.stacks[i] += unit);
    let odd = pot.amt - unit * win.length;
    for (const i of order) if (odd && win.includes(i)) { const c = Math.min(CHIP, odd); G.stacks[i] += c; odd -= c; }
    pot.win = win;
  }
  H.result = { pots, win: [...new Set(pots.flatMap(p => p.win))], pot: total, showdown: lv.length > 1, score };
  H.committed.fill(0); H.bets.fill(0);
  // 탈락: 같은 핸드에서 여럿이 떨어지면 핸드 시작 때 칩이 많았던 사람이 더 높은 순위
  const bust = alive().filter(i => G.stacks[i] === 0).sort((a, b) => H.start[b] - H.start[a]);
  const remain = alive().length - bust.length;
  bust.forEach((i, k) => { G.out[i] = true; G.place[i] = remain + 1 + k; });
  if (alive().length === 1) G.place[alive()[0]] = 1;
  H.busted = bust;
}
// 한 단계 진행: 'act'(H.toAct 차례) | 'deal'(카드 깔림) | 'end'(정산 완료)
function step() {
  const many = live().length > 1;
  if (many && !roundOver()) { if (!needsAction(H.toAct)) H.toAct = nextOf(Math.max(0, H.toAct), needsAction); return 'act'; }
  if (many && H.board.length < 5) { nextStreet(); return 'deal'; }
  settle(); return 'end';
}

// ===== AI: 각자 자기 칩 기대값(EV)을 최대화. 서로 편먹지 않고 자기 패와 공개 정보만 본다 =====
// 성격은 계산식은 같고 몇 가지 성향만 다르다.
//  risk: 콜당했을 때 잃을 칩 감점 / bluff·slow: 블러프·슬로플레이 빈도 / realize: 에퀴티 실현율 보정(+면 더 콜)
//  defend: 상대가 얼마나 버틸 거라고 보는지(작을수록 상대가 잘 접는다고 봄) / press: 레이즈 가산점(팟 대비)
const STYLES = {
  pro:     { tag: '정석',   risk: 0.04, bluff: 0.12, slow: 0.15, realize: 0,     defend: 1,    press: 0 },
  rock:    { tag: '바위',   risk: 0.07, bluff: 0.04, slow: 0.08, realize: -0.05, defend: 1.05, press: 0 },
  station: { tag: '콜링',   risk: 0.02, bluff: 0.05, slow: 0.2,  realize: 0.07,  defend: 1.15, press: 0 },
  lag:     { tag: '공격형', risk: 0.03, bluff: 0.25, slow: 0.05, realize: 0.02,  defend: 0.88, press: 0.05 },
};
// ponytail: EV는 이번 베팅 라운드만 본다(이후 스트리트의 임플라이드 오즈 무시). 칩 EV = 승자독식 토너먼트의 우승 확률에 비례한다고 본다(ICM 미적용)
function decide(p) {
  // G.styles[p]: 페르소나(수치 묶음) 또는 성격 이름
  const s0 = G.styles[p], S = typeof s0 === 'object' && s0 ? s0 : STYLES[s0] || STYLES.pro, L = legal(p), mb = maxBet(), opps = live().filter(i => i !== p);
  const myAfter = H.committed[p] + L.toCall;
  const potCall = H.committed.reduce((s, c, i) => s + Math.min(i === p ? myAfter : c, myAfter), 0); // 콜하면 내가 이길 수 있는 팟
  const potAll = sum(H.committed); // 모두 접으면 내가 가져가는 칩
  const map = strengthMap(H.board, new Set([...H.hole[p], ...H.board]));
  // 상대마다 성향을 학습 (사전값에서 시작해 관찰로 갱신). rr: 레이즈 빈도(사전값 75%) / 방어: 1 = MDF만큼 콜
  const rrOf = q => (G.stats[q].raises + 3) / (G.stats[q].chances + 4);
  const defOf = q => (G.stats[q].faced - G.stats[q].folded + 2) / (G.stats[q].mdf + 2) * S.defend;
  const cuts = opps.map(q => rangeCut(H.aggro[q], rrOf(q)));
  const it = Math.max(400, Math.round(ITERS * 2 / (opps.length + 1)));
  const eq = equity(H.hole[p], H.board, cuts, map, it);
  // 에퀴티 실현율: 뒤에 스트리트가 남으면 약한 패는 상대 베팅에 접게 돼 승률을 다 못 챙기고, 강한 패는 더 뽑아낸다 (올인이면 그대로)
  const later = H.board.length < 5;
  const realize = (e, allIn) => later && !allIn ? e * Math.min(1.1, Math.max(0.6, 0.85 + (e - 0.5) + S.realize)) : e;
  const opts = [];
  if (!L.canCheck) opts.push({ type: 'fold', label: '폴드', ev: 0 });
  opts.push({ type: L.canCheck ? 'check' : 'call', label: L.canCheck ? '체크' : '콜', to: H.bets[p] + L.toCall,
              ev: realize(eq, L.toCall >= G.stacks[p] || opps.every(q => !G.stacks[q])) * potCall - L.toCall });
  let sims = it;
  if (L.canRaise) {
    const seen = new Set(), verb = mb ? '레이즈' : '베팅';
    for (const [x, name] of [[0.5, '1/2팟'], [1, '팟'], [Infinity, '올인']]) {
      const to = Math.max(L.minTo, Math.min(L.maxTo, Math.round((mb + x * potCall) / CHIP) * CHIP));
      const risk = to - H.bets[p], P = potAll + risk;
      // 올인은 상대가 낼 돈이 팟의 3배 이하일 때만 (스택이 깊을 때 과도한 오버벳 올인 방지)
      if (seen.has(to) || (to === L.maxTo && to - mb > 3 * potCall)) continue;
      seen.add(to);
      // 상대마다: 크게 걸수록 더 많이 접지만, 콜해 오는 건 레인지 상위 (1-f)뿐. 올인한 상대는 접을 수 없다
      let fAll = 1, reRaisers = 0, expCall = 0;
      const fq = opps.map(q => {
        if (!G.stacks[q]) { fAll = 0; return 0; }
        const call = Math.min(to - H.bets[q], G.stacks[q]), f = Math.min(0.9, Math.max(0, 1 - defOf(q) * (P - call) / P));
        fAll *= f; expCall += (1 - f) * call; if (G.stacks[q] > call) reRaisers++;
        return f;
      });
      const qr = Math.min(1 - fAll, 1 - 0.9 ** reRaisers); // 누군가 다시 레이즈하면 접고 건 돈을 잃는다
      const eqC = equity(H.hole[p], H.board, cuts.map((c, k) => c + (1 - c) * fq[k]), map, it); sims += it;
      const potCalled = P + (fAll < 1 ? expCall / (1 - fAll) : 0);
      opts.push({ type: 'raise', label: to === L.maxTo ? '올인' : `${verb} ${name}`, to, f: fAll, eqC,
                  ev: fAll * potAll + (1 - fAll - qr) * (realize(eqC, to === L.maxTo) * potCalled - risk) - qr * risk + S.press * potCall });
    }
  }
  // 위험 보정: EV 차이가 작으면 콜당했을 때 잃을 칩이 적은 쪽을 고른다
  const riskAdj = x => x.ev - S.risk * (x.type === 'raise' ? (1 - x.f) * (x.to - H.bets[p]) : x.type === 'call' ? L.toCall : 0);
  let pick = opts.reduce((a, b) => riskAdj(b) > riskAdj(a) ? b : a);
  let tag = pick === opts.reduce((a, b) => b.ev > a.ev ? b : a) ? '' : '리스크 회피';
  const r = Math.random();
  if (pick.type === 'raise' && eq > 0.8 && later && r < S.slow) {
    pick = opts.find(x => x.type === 'check' || x.type === 'call'); tag = '슬로플레이';
  } else if (pick.type === 'check' && opts.some(x => x.type === 'raise') && eq < 0.35 && r < S.bluff) {
    pick = opts.find(x => x.type === 'raise'); tag = '블러프';
  }
  const avg = a => a.length ? sum(a) / a.length : 0, seenQ = opps.filter(q => G.stats[q].faced);
  return { type: pick.type, to: pick.to, info: { who: p, eq, opts, pick, tag, iters: sims, street: H.board.length, opps: opps.length,
    cut: avg(cuts), rr: avg(opps.map(rrOf)), foldSeen: seenQ.length ? avg(seenQ.map(q => G.stats[q].folded / G.stats[q].faced)) : null,
    potOdds: L.toCall / (potCall || 1) } };
}

// ===== 셀프 테스트 (?test=1) =====
function selfTest() {
  const E = s => evaluate(s.split(' ').map(card)), cat = s => Math.floor(E(s) / 13 ** 5);
  // 사이드팟 시나리오: 정해진 패·보드로 정산만 확인
  const pot = (stacks, committed, folded, holes, board, button = 0) => {
    const saved = [G, H];
    G = { n: stacks.length, stacks: stacks.slice(), out: stacks.map(() => false), place: stacks.map(() => null), button, hand: 1, level: 0, stats: [] };
    H = { committed: committed.slice(), bets: committed.map(() => 0), folded: folded.slice(), hole: holes.map(h => h ? h.split(' ').map(card) : []),
          board: board.split(' ').map(card), start: committed.map((c, i) => c + stacks[i]) };
    settle();
    const r = { stacks: G.stacks, place: G.place };
    [G, H] = saved;
    return r;
  };
  const cases = [
    ['휠 스트레이트', () => cat('As 2d 3c 4h 5s 9d Kc') === 4],
    ['6 하이 > 휠', () => E('2d 3c 4h 5s 6d Kc Qh') > E('As 2d 3c 4h 5s 9d Kc')],
    ['브로드웨이 > K 하이 스트레이트', () => E('As Kd Qc Jh Ts 2d 3c') > E('Ks Qd Jc Th 9s 2d 3c')],
    ['플러시 > 스트레이트', () => E('2h 7h 9h Jh Kh 3c 4d') > E('5s 6d 7c 8h 9s 2d Kc')],
    ['풀하우스는 트리플이 결정', () => E('Ks Kd Kc 2h 2s 5d 7c') > E('Qs Qd Qc Ah As 5d 7c')],
    ['트리플 두 개 → 풀하우스', () => cat('7s 7d 7c 5h 5s 5d Ac') === 6 && E('7s 7d 7c 5h 5s 5d Ac') === E('7h 7d 7c 5h 5s Kd Ac')],
    ['투페어 키커', () => E('As Ad Ks Kd Qc 2h 3s') > E('As Ad Ks Kd Jc 2h 3s')],
    ['페어 세 개 → 상위 둘 + 키커', () => E('As Ad Ks Kd Qc Qh 2s') === E('As Ad Ks Kd Qc 3h 2s')],
    ['보드 스트레이트는 찹', () => E('2c 3d As Kd Qc Jh Ts') === E('4c 5d As Kd Qc Jh Ts')],
    ['스트레이트 플러시 > 포카드', () => E('5h 6h 7h 8h 9h 9s 9d') > E('As Ad Ac Ah Kd 2s 3c')],
    ['6장 플러시는 상위 5장', () => E('Ah Kh 9h 7h 4h 2h 3c') === E('Ah Kh 9h 7h 4h 3h 3c')],
    ['포카드 키커', () => E('9s 9d 9c 9h As 2d 3c') > E('9s 9d 9c 9h Ks Qd Jc')],
    ['로열 플러시 이름', () => handName(E('As Ks Qs Js Ts 2d 3c')) === '로열 플러시'],
    ['best5 = 7장 평가', () => { const cs = 'Ks Kd Kc 2h 2s 5d 7c'.split(' ').map(card); return best5(cs).score === evaluate(cs); }],
    ['프리플랍 백분위', () => PCT[card('As') * 52 + card('Ah')] > 0.95 && PCT[card('7s') * 52 + card('2d')] < 0.1],
    // 0: 1,000 올인(최강), 1: 3,000 올인(중간), 2: 5,000(최약), 3: 2,000 내고 폴드 → 메인 4,000은 0, 사이드 5,000은 1, 남는 2,000은 2
    ['사이드팟: 짧은 올인이 이기면 메인만', () => { const r = pot([0, 0, 0, 1000], [1000, 3000, 5000, 2000], [false, false, false, true],
      ['As Ad', 'Ks Kd', '7c 2h', '9s 9d'], 'Ah Kh 5c 3d 8s');
      return r.stacks.join() === '4000,5000,2000,1000' && r.place.every(x => x === null); }],
    ['사이드팟: 세 명 나눠먹기 + 남는 칩', () => { const r = pot([0, 0, 0], [300, 300, 300], [false, false, false],
      ['2c 3c', '2d 3d', '2h 3h'], 'As Ks Qs Js 9d', 0); // 보드 플레이 → 900을 셋이 300씩
      return r.stacks.join() === '300,300,300'; }],
    ['남는 1칩은 버튼 왼쪽부터', () => { const r = pot([0, 0, 1000], [100, 100, 100], [false, false, true],
      ['2c 3c', '2d 3d', '7h 8h'], 'As Ks Qs Js 9d', 0); // 300을 둘이: 100씩 + 남는 100은 버튼(0) 왼쪽인 1에게
      return r.stacks.join() === '100,200,1000'; }],
    ['폴드한 사람의 칩도 팟에 남는다', () => { const r = pot([0, 500, 0], [400, 400, 200], [false, false, true],
      ['As Ad', '7c 2h', 'Ks Kd'], 'Ah Kh 5c 3d 8s');
      return r.stacks.join() === '1000,500,0'; }],
  ];
  return { total: cases.length, fails: cases.filter(([, f]) => { try { return !f(); } catch (e) { return true; } }).map(([n]) => n) };
}
</script>

<script>
// ===== UI =====
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search), FAST = Q.has('fast'); // ?fast=1: 확인용으로 연출을 빠르게
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const T = ms => FAST ? Math.round(ms * 0.05) : calm ? Math.round(ms * 0.35) : ms;
const sleep = ms => new Promise(r => setTimeout(r, T(ms)));
const pct = x => (x * 100).toFixed(1) + '%';
const STREET = { 0: '프리플랍', 3: '플랍', 4: '턴', 5: '리버' };
const SHOT_CLOCK = 20, TIME_CHIP_SEC = 30, TIME_CHIPS = 3;
const LEVEL_MIN = 5, LEVEL_MS = LEVEL_MIN * 60000 * (FAST ? 0.05 : 1); // 레벨마다 5분 (터보 대회)
let phase = 'lobby', mode = 'hu', bios = [], run = 0, nextTimer = null, tourTimer = null;

// 브라우저 저장소 (사생활 모드 등에서 막혀도 게임은 돌아가게)
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const REC = Object.assign({ games: 0, won: 0, hands: 0, handsWon: 0, bestPot: 0 }, store.get('holdem.record', {}));
const RFT = Object.assign({ 6: { games: 0, wins: 0, best: 0, sum: 0 }, 9: { games: 0, wins: 0, best: 0, sum: 0 } }, store.get('holdem.record.ft', {}));
// 키 이름 변경: 예전 "소리 켬"(상태 표시) 버튼을 켜는 버튼으로 오해해 꺼 둔 설정을 초기화
let soundOn = store.get('holdem.sound.v2', true), actx = null;

// 오디오 장치: 없거나 닫혔으면 만들고, 실행 중이 아니면(suspended, iOS의 interrupted 등) 깨운다
function audio() {
  if (!actx || actx.state === 'closed') actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state !== 'running') actx.resume().catch(() => {});
  return actx;
}
// 화면을 내렸다 켜면 모바일 브라우저가 오디오를 멈추거나, '실행 중'인데 출력만 끊긴 채로 두기도 한다 → 돌아오면 새로 만든다
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !actx) return;
  const old = actx; actx = null; old.close().catch(() => {});
});
// iOS는 사용자 동작 안에서만 소리를 허락하므로 다음 터치 때 확실히 깨운다
addEventListener('pointerdown', () => { if (soundOn && (!actx || actx.state !== 'running')) audio(); }, true);

// 효과음: 음원 파일 없이 Web Audio로 합성
function sfx(kind, n = 1) {
  if (!soundOn) return;
  try {
    audio();
    const t = actx.currentTime + 0.01, bus = actx.createDynamicsCompressor(); // 겹치는 소리가 찢어지지 않게
    bus.threshold.value = -6; bus.knee.value = 6; bus.ratio.value = 8; bus.attack.value = 0.003; bus.release.value = 0.1;
    bus.connect(actx.destination);
    const env = (node, at, dur, vol) => {
      const g = actx.createGain();
      g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
      node.connect(g).connect(bus);
    };
    const tone = (f, at, dur, vol, type = 'sine', f2) => {
      const o = actx.createOscillator();
      o.type = type; o.frequency.setValueAtTime(f, t + at);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + at + dur);
      env(o, t + at, dur, vol); o.start(t + at); o.stop(t + at + dur + 0.05);
    };
    const hiss = (at, dur, vol, f) => {
      const b = actx.createBuffer(1, Math.ceil(actx.sampleRate * dur), actx.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const s = actx.createBufferSource(), bp = actx.createBiquadFilter();
      s.buffer = b; bp.type = 'bandpass'; bp.frequency.value = f; s.connect(bp);
      env(bp, t + at, dur, vol); s.start(t + at);
    };
    // 폰·노트북 스피커 기준: 300Hz 이상, 피크 약 -6dBFS
    ({
      deal: () => { for (let i = 0; i < n; i++) hiss(i * 0.09, 0.06, 1.6, 3000); },
      chip: () => { tone(2200, 0, 0.06, 0.5, 'triangle'); tone(2900, 0.05, 0.08, 0.45, 'triangle'); },
      check: () => { tone(900, 0, 0.06, 0.5, 'sine', 420); tone(900, 0.11, 0.06, 0.45, 'sine', 420); },
      fold: () => hiss(0, 0.22, 2.2, 1200),
      win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.09, 0.4, 0.35, 'triangle')),
      lose: () => [784, 659, 494].forEach((f, i) => tone(f, i * 0.14, 0.45, 0.35, 'triangle')),
      level: () => { tone(660, 0, 0.14, 0.4, 'square'); tone(990, 0.14, 0.3, 0.4, 'square'); },
      tick: () => tone(1600, 0, 0.035, 0.35, 'square'),
    })[kind]();

  const [nsb, nbb] = LEVELS[Math.min(G.level + 1, LEVELS.length - 1)], mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

}

  sfx('chip'); log(`타임칩 사용 · +${TIME_CHIP_SEC}초 (남은 타임칩 ${G.timeChips}개)`, 'street');
  const b = $('bTime'), n = b.cloneNode(true); n.removeAttribute('id');
  fly(n, centerOf(b), centerOf($('clock')), { dur: 420, fade: true, scale: 0.6 });
  renderTimeChips();
}

// ===== EV 계기판 =====
function renderGauge() {
  const D = H.decision, g = $('gauge'), open = !!H.result || $('cheat').checked, st = $('gState');
  g.classList.toggle('sealed', !!D && !open);
  st.classList.toggle('busy', phase === 'ai');
  st.textContent = phase === 'ai' ? '계산 중' : !D ? '대기' : open ? '공개' : '봉인';
  $('gWho').textContent = D && G.n > 2 ? `· ${who(D.who)}` : '';
  if (g._D === D) return;
  g._D = D;
  if (!D) {
    $('gBody').innerHTML = '<p class="empty">AI는 행동할 때마다 몬테카를로 시뮬레이션으로 승률을 구하고, 폴드·콜·레이즈의 기대값(EV)을 칩 단위로 비교해 가장 높은 쪽을 골라요. 서로 편먹지 않고 각자 우승을 노려요.</p>';
    $('gPick').innerHTML = '';
    return;
  }
  const max = Math.max(1, ...D.opts.map(o => Math.abs(o.ev)));
  const sgn = v => (v > 0.5 ? '+' : v < -0.5 ? '−' : '') + fmt(Math.round(Math.abs(v)));
  $('gBody').innerHTML = `
    <div class="eq"><span class="k">승률</span><b>${pct(D.eq)}</b>${D.tag ? `<span class="tag">${D.tag}</span>` : ''}</div>
    <div class="meter"><i style="width:${D.eq * 100}%"></i>${D.potOdds ? `<em style="left:${D.potOdds * 100}%"><span>팟 오즈 ${pct(D.potOdds)}</span></em>` : ''}</div>
    <dl class="meta">
      <div><dt>상대 레인지${D.opps > 1 ? `(${D.opps}명 평균)` : ''}</dt><dd>상위 ${Math.round((1 - D.cut) * 100)}%</dd></div>
      <div><dt>상대 레이즈 빈도</dt><dd>${pct(D.rr)}</dd></div>
      <div><dt>상대 폴드율(관찰)</dt><dd>${D.foldSeen === null ? '—' : pct(D.foldSeen)}</dd></div>
      <div><dt>시뮬레이션</dt><dd>${fmt(D.iters)}회</dd></div>
    </dl>
    <ul class="evs">${D.opts.map(o => `
      <li class="${o === D.pick ? 'on' : ''}">
        <span>${o.label}${o.type === 'raise' ? `<small>→ ${fmt(o.to)} · <i>${D.opps > 1 ? '모두 ' : ''}폴드 ${Math.round(o.f * 100)}%</i> · <i>콜 시 ${Math.round(o.eqC * 100)}%</i></small>` : ''}</span>
        <span class="bar">${Math.abs(o.ev) > 0.5 ? `<i class="${o.ev < 0 ? 'neg' : ''}" style="width:${Math.abs(o.ev) / max * 50}%"></i>` : ''}</span>
        <b class="${o.ev < -0.5 ? 'neg' : ''}">${sgn(o.ev)}</b>
      </li>`).join('')}
    </ul>`;
  $('gPick').innerHTML = `<span>${STREET[D.street]} 결정</span><b>${D.pick.label}${D.pick.type === 'raise' ? ' ' + fmt(D.pick.to) : ''}</b>`;
}
function countUp(total) { // 계산 중 헤더에 시뮬레이션 횟수를 올려 보여 준다 (공개 정보)
  if (calm || FAST) return;
  const t0 = performance.now();
  const tick = t => { if (phase !== 'ai') return; const k = Math.min(1, (t - t0) / 600);
    $('gState').textContent = `시뮬레이션 ${fmt(Math.round(total * k))}회`; if (k < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}

// ===== 진행 =====
async function showAction(p, label, paid) {
  say(p, label); log(`${who(p)}: ${label}`); actSound(label);
  if (label === '폴드') await muckAnim(p);
  else if (paid > 0) await chipFly(p, paid);
}
async function aiTurn(p, me) {
  phase = 'ai'; render();
  const quick = G.n > 2, idle = H.folded[0] || G.out[0]; // 내가 빠진 핸드는 템포를 빠르게
  await sleep(idle ? 120 : quick ? 220 : 350);
  if (me !== run) return;
  const d = decide(p);
  H.decision = d.info; render(); countUp(d.info.iters);
  await sleep(idle ? 200 : quick ? 480 : 950);
  if (me !== run) return;
  const before = G.stacks[p], label = act(p, d.type, d.to);
  await showAction(p, label, before - G.stacks[p]);
  phase = 'deal'; render();
}
async function advance() {
  const me = run;
  for (;;) {
    if (me !== run) return;
    const s = step();
    if (s === 'end') return onHandEnd(me);
    if (s === 'deal') {
      await collectAnim();
      phase = 'deal';
      const k = H.board.length;
      log(`${STREET[k]}  ${H.board.slice(k === 3 ? 0 : -1).map(cardText).join(' ')}`, 'street');
      for (const i of live()) if (G.stacks[i]) say(i, '');
      render();
      await sleep(live().filter(i => G.stacks[i]).length > 1 ? 650 : 1100); // 올인 런아웃은 한 장씩 천천히
      continue;
    }
    const p = H.toAct;
    if (p !== 0) { await aiTurn(p, me); continue; }
    const L = legal(0), sl = $('slider');
    sl.max = L.maxTo; sl.min = L.minTo; sl.value = L.minTo;
    buildPresets();
    phase = 'player'; render(); startClock();
    return;
  }
}
async function playerAct(type, to) {
  if (phase !== 'player') return;
  const me = run;
  stopClock(); phase = 'busy';
  const before = G.stacks[0], label = act(0, type, to);
  render();
  await showAction(0, label, before - G.stacks[0]);
  if (me !== run) return; // 연출 중에 로비로 나갔으면 이전 게임을 이어 가지 않는다
  phase = 'deal'; render();
  advance();
}

async function onHandEnd(me) {
  phase = 'end';
  const R = H.result;
  await collectAnim();
  setChipset($('pile'), R.pot, 2, 5, 10); // 정산 전 팟을 그대로 보여 준 채로 연출
  // 쇼다운: 남은 사람 패를 뒤집고 족보 표시, 메인팟 승자의 5장을 강조
  const b = R.showdown ? Object.fromEntries(live().map(i => [i, best5([...H.hole[i], ...H.board])])) : null;
  for (let i = 0; i < G.n; i++) renderHole(i);
  if (b) {
    for (const i of live()) $('hname' + i).textContent = handName(b[i].score);
    const hot = new Set(R.pots[0].win.flatMap(i => b[i].cards));
    document.querySelectorAll('#board .card, #seats .card[data-c]').forEach(el => el.classList.add(hot.has(+el.dataset.c) ? 'win' : 'dim'));
    log(`쇼다운 · ${live().map(i => `${who(i)} ${handName(b[i].score)}${i ? ` (${H.hole[i].map(cardText).join(' ')})` : ''}`).join(' / ')}`);
    await sleep(1300);
  } else await sleep(300);
  if (me !== run) return;
  // 팟 → 승자 (사이드팟이면 팟마다)
  await payoutAnim(R.pots);
  for (const i of R.win) $('seat' + i).classList.add('win');
  for (let i = 0; i < G.n; i++) countStack(i);
  const heroWon = R.win.includes(0), tie = R.win.length > 1 && R.pots.length === 1;
  sfx(heroWon ? (tie ? 'chip' : 'win') : H.folded[0] ? 'chip' : 'lose');
  const main = R.pots[0], names = main.win.map(who).join(' · ');
  $('banner').className = 'banner ' + (main.win.includes(0) ? (main.win.length > 1 ? 'tie' : 'win') : 'lose');
  $('banner').innerHTML = `<strong>${main.win.length > 1 ? `${names} 나눠 가짐` : `${names} 승리`}</strong><span>팟 ${fmt(R.pot)} · ${
    b ? handName(b[main.win[0]].score) : '모두 폴드'}${R.pots.length > 1 ? ` · 사이드팟 ${R.pots.length - 1}개` : ''}</span>`;
  R.pots.forEach((p, k) => log(`${k ? `사이드팟 ${k}` : '팟'} ${fmt(p.amt)} → ${p.win.map(who).join(' · ')}`, 'result'));
  // 탈락
  for (const i of H.busted) {
    const bd = $('badge' + i); bd.hidden = false; bd.textContent = `${G.place[i]}위`;
    $('seat' + i).classList.add('out');
    log(`${who(i)} 탈락 · ${G.place[i]}위`, 'level');
  }
  if (H.hole[0].length) { G.stats[0].hands++; store.set(PROFILE_KEY, G.stats[0]); renderProfile(); }
  if (G.n === 2) { REC.hands++; if (heroWon && !tie) { REC.handsWon++; REC.bestPot = Math.max(REC.bestPot, R.pot); } store.set('holdem.record', REC); }
  render();
  if (G.out[0] || alive().length === 1) { await sleep(1400); if (me === run) endTournament(!G.out[0]); return; }
  autoNext(H.folded[0] ? 2 : 4);
}
function autoNext(sec) { // 다음 핸드는 잠시 뒤 자동으로 (버튼을 누르면 바로)
  clearInterval(nextTimer);
  let left = FAST ? 0 : sec;
  const tick = () => { if (left <= 0) { clearInterval(nextTimer); startHand(); return; } $('bNext').textContent = `다음 핸드 (${left--})`; };
  nextTimer = setInterval(tick, 1000); // 타이머를 먼저 잡아야 0초일 때 두 번 시작하지 않는다
  tick();
}
async function startHand(fresh = false) {
  clearInterval(nextTimer);
  if (!fresh && phase !== 'end') return; // 핸드가 끝난 뒤에만 다음 핸드 (중복 시작 방지)
  const me = run;
  let up = false;
  while (G.level < LEVELS.length - 1 && performance.now() >= G.levelEnds) { G.level++; G.levelEnds += LEVEL_MS; up = true; }
  G.announced = false;
  newHand();
  for (let i = 0; i < G.n; i++) { say(i, ''); $('hname' + i).textContent = ''; $('seat' + i).classList.remove('win'); }
  document.querySelectorAll('.bio').forEach(x => x.remove());
  $('board').textContent = ''; $('board')._cards = [];
  log(`핸드 #${G.hand} · 딜러 버튼 ${who(G.button)}`, 'head');
  phase = 'deal'; dealing = true;
  moveDealer(); render();
  if (up) {
    const [sb, bb] = LEVELS[G.level];
    flashBanner(`블라인드 상승`, `레벨 ${G.level + 1} · ${fmt(sb)}/${fmt(bb)}`);
    log(`블라인드 상승 → ${fmt(sb)}/${fmt(bb)}`, 'level'); sfx('level');
    const el = $('blinds'); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
  }
  say(H.sbSeat, 'SB ' + fmt(H.bets[H.sbSeat])); say(H.bbSeat, 'BB ' + fmt(H.bets[H.bbSeat]));
  await dealAnim();
  dealing = false;
  if (me !== run) return;
  await sleep(250);
  advance();
}

// ===== 로비·결과 =====
function start(m) {
  run++; stopClock(); clearInterval(nextTimer);
  mode = m;
  const n = m === 'hu' ? 2 : m === 'ft6' ? 6 : 9;
  if (n === 2) { newGame({ names: ['나', '컴퓨터'], styles: [null, 'pro'], stacks: [20000, 20000] }); bios = ['', '']; }
  else {
    const names = shuffle(NAME_POOL.slice()).slice(0, n - 1), ps = names.map(persona);
    const st = Array.from({ length: n }, () => (16 + Math.floor(Math.random() * 33)) * 500).sort((a, b) => a - b); // 8,000~24,000칩
    const mine = st.splice(n >> 1, 1)[0]; shuffle(st); // 나는 중간 정도 스택
    newGame({ names: ['나', ...names], styles: [null, ...ps.map(p => p.style)], stacks: [mine, ...st] });
    bios = ['', ...ps.map(p => p.bio)];
  }
  G.timeChips = TIME_CHIPS;
  G.levelEnds = performance.now() + LEVEL_MS; clearInterval(tourTimer); tourTimer = setInterval(renderBlinds, 1000);
  G.stats[0] = loadProfile(); // AI들은 지난 게임에서 본 내 스타일을 기억하고 시작한다
  $('modeName').textContent = n === 2 ? '헤즈업 홀덤' : `파이널 테이블 ${n}인`;
  $('modeSub').textContent = n === 2 ? '노리밋 · vs EV 컴퓨터' : '노리밋 토너먼트 · 우승을 노려라';
  $('lobby').hidden = true; $('endModal').hidden = true;
  $('log').textContent = '';
  buildTable(); renderRecord(); renderProfile();
  if (n > 2) { log(`파이널 테이블 ${n}인 · 블라인드는 ${LEVEL_MIN}분마다 올라요`, 'head'); for (let i = 1; i < n; i++) log(`${who(i)} · ${bios[i]} · ${fmt(G.stacks[i])}칩`, 'street'); log('상대의 플레이 성향은 토너먼트가 끝나면 공개돼요', 'street'); }
  phase = 'deal';
  startHand(true);
}
function endTournament(won) {
  stopClock(); clearInterval(nextTimer); clearInterval(tourTimer); phase = 'over';
  const place = won ? 1 : G.place[0], n = G.n;
  if (n === 2) { REC.games++; if (won) REC.won++; store.set('holdem.record', REC); }
  else { const r = RFT[n]; r.games++; if (won) r.wins++; r.best = r.best ? Math.min(r.best, place) : place; r.sum += place; store.set('holdem.record.ft', RFT); }
  renderRecord();
  $('endTitle').textContent = won ? (n === 2 ? '완승!' : '우승!') : n === 2 ? '패배' : `${place}위로 탈락`;
  $('endSub').textContent = won ? `${n === 2 ? '컴퓨터의 칩을 모두 땄어요' : `${n}명 중 마지막까지 살아남았어요`} · ${G.hand}핸드` : `${G.hand}핸드 · 레벨 ${G.level + 1}`;
  if (n > 2) $('endSub').textContent += ' · 상대 성향 공개';
  const rows = G.names.map((nm, i) => ({ i, nm, place: G.place[i] })).sort((a, b) => (a.place ?? 0) - (b.place ?? 0));
  $('standings').innerHTML = rows.map(r => `<li class="${r.i ? '' : 'me'}"><span>${r.place ? r.place + '위' : '진행 중'}</span><span>${r.nm}${r.i && n > 2 ? ` · ${G.styles[r.i].tag}` : ''}</span><span>${r.place ? '' : fmt(G.stacks[r.i]) + '칩'}</span></li>`).join('');
  $('endModal').hidden = false;
  sfx(won ? 'win' : 'lose');
  if (won) chipRain();
  render();
}
function chipRain() { // 우승 축하: 칩이 쏟아진다
  if (calm) return;
  for (let k = 0; k < 36; k++) {
    const img = new Image(), d = pickOne(DENOMS), x = Math.random() * innerWidth;
    img.src = `assets/chips/chip-${d}-${k % 2}.png`; img.style.width = 26 + Math.random() * 18 + 'px';
    fly(img, { x, y: -40 }, { x: x + (Math.random() - 0.5) * 160, y: innerHeight + 40 }, { dur: 1600 + Math.random() * 1200, rot: (Math.random() - 0.5) * 720, delay: k * 45 });
  }
}
function showLobby() {
  run++; stopClock(); clearInterval(nextTimer); clearInterval(tourTimer); phase = 'lobby';
  $('endModal').hidden = true; $('lobby').hidden = false;
  $('lr-hu').textContent = REC.games ? `${REC.won}승 ${REC.games - REC.won}패` : '';
  for (const n of [6, 9]) { const r = RFT[n]; $('lr-ft' + n).textContent = r.games ? `${r.games}판 · 우승 ${r.wins}회 · 최고 ${r.best}위` : ''; }
}
function renderRecord() {
  if (!G || G.n === 2) {
    $('rL1').textContent = '게임'; $('r1').textContent = `${REC.won}승 ${REC.games - REC.won}패`;
    $('rL2').textContent = '핸드 승률'; $('r2').innerHTML = REC.hands ? `${Math.round(REC.handsWon / REC.hands * 100)}%<small>${REC.handsWon}/${REC.hands}</small>` : '—';
    $('rL3').textContent = '최대로 딴 팟'; $('r3').textContent = REC.bestPot ? fmt(REC.bestPot) : '—';
  } else {
    const r = RFT[G.n];
    $('rL1').textContent = `${G.n}인 토너먼트`; $('r1').innerHTML = `${r.games}판<small>우승 ${r.wins}</small>`;
    $('rL2').textContent = '최고 순위'; $('r2').textContent = r.best ? `${r.best}위` : '—';
    $('rL3').textContent = '평균 순위'; $('r3').textContent = r.games ? `${(r.sum / r.games).toFixed(1)}위` : '—';
  }
}
// ===== AI가 기억하는 내 스타일 (브라우저에 저장, 모든 모드 공통) =====
const PROFILE_KEY = 'holdem.profile';
function loadProfile() {
  const p = Object.assign({ faced: 0, folded: 0, mdf: 0, chances: 0, raises: 0, hands: 0 }, store.get(PROFILE_KEY, {}));
  // ponytail: 오래된 기록이 스타일 변화를 막지 않게 레이즈 기회 400번 분량으로 눌러 둔다(비율은 그대로). 더 정교하게 하려면 지수 감쇠
  const k = p.chances > 400 ? 400 / p.chances : 1;
  for (const f of ['faced', 'folded', 'mdf', 'chances', 'raises']) p[f] *= k;
  return p;
}
function renderProfile() {
  const p = G ? G.stats[0] : loadProfile(), r = x => Math.round(x * 100);
  $('prof').textContent = p.hands
    ? `AI가 기억하는 나 · 레이즈 ${r(p.raises / Math.max(1, p.chances))}% · 베팅에 폴드 ${r(p.folded / Math.max(1, p.faced))}% · ${fmt(p.hands)}핸드`
    : 'AI가 아직 나를 몰라요. 칠수록 내 스타일을 기억해요';
}
let forgetArm = null;
$('bForget').onclick = () => { // 두 번 눌러야 지운다
  const b = $('bForget');
  if (!forgetArm) { b.textContent = '한 번 더 누르면 지워요'; b.classList.add('warn'); forgetArm = setTimeout(() => { forgetArm = null; b.textContent = '기억 초기화'; b.classList.remove('warn'); }, 3000); return; }
  clearTimeout(forgetArm); forgetArm = null; b.textContent = '기억 초기화'; b.classList.remove('warn');
  try { localStorage.removeItem(PROFILE_KEY); } catch {}
  if (G) Object.assign(G.stats[0], { faced: 0, folded: 0, mdf: 0, chances: 0, raises: 0, hands: 0 });
  renderProfile(); log('AI의 기억을 지웠어요', 'level');
};
function renderSound() {
  $('bSound').textContent = soundOn ? '소리 끄기' : '소리 켜기'; // 누르면 일어날 일을 쓴다
  $('bSound').setAttribute('aria-pressed', soundOn);
}

$('bFold').onclick = () => playerAct('fold');
$('bCall').onclick = () => playerAct(legal(0).canCheck ? 'check' : 'call');
$('bRaise').onclick = () => playerAct('raise', +$('slider').value);
$('slider').oninput = raiseLabel;
const nudge = d => { $('slider').value = +$('slider').value + d * H.bb; raiseLabel(); }; // 범위 밖이면 슬라이더가 알아서 끝값으로 맞춘다
$('bMinus').onclick = () => nudge(-1);
$('bPlus').onclick = () => nudge(1);
$('bNext').onclick = () => startHand();
$('cheat').onchange = renderGauge;
$('bSound').onclick = () => { soundOn = !soundOn; store.set('holdem.sound.v2', soundOn); renderSound(); sfx('chip'); };
document.querySelectorAll('.mode').forEach(b => b.onclick = () => start(b.dataset.mode));
$('bAgain').onclick = () => start(mode);
$('bToLobby').onclick = showLobby;
let lobbyArm = null; // 게임 중 로비 버튼은 두 번 눌러야 나간다
$('bLobby').onclick = () => {
  const b = $('bLobby');
  if (phase === 'lobby' || phase === 'over' || lobbyArm) { clearTimeout(lobbyArm); lobbyArm = null; b.textContent = '로비'; b.classList.remove('warn'); showLobby(); return; }
  b.textContent = '한 번 더 누르면 나가요'; b.classList.add('warn');
  lobbyArm = setTimeout(() => { lobbyArm = null; b.textContent = '로비'; b.classList.remove('warn'); }, 3000);
};
addEventListener('resize', () => G && placeSeats());

renderSound(); renderRecord(); renderProfile(); showLobby();
if (Q.has('mode')) start(Q.get('mode')); // 확인용: ?mode=ft6 로 바로 시작
if (Q.has('test')) {
  const t = selfTest();
  console.log('selfTest', t);
  log(t.fails.length ? `셀프 테스트 실패: ${t.fails.join(', ')}` : `셀프 테스트 ${t.total}개 모두 통과`, 'result');
}
</script>
</body>
