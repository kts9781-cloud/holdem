<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>헤즈업 홀덤 · 새 주소로 이사했어요</title>
<meta name="robots" content="noindex">
<!-- 예전 초대 링크를 카톡에 보내도 미리보기가 나오게 -->
<meta property="og:type" content="website">
<meta property="og:title" content="홀덤 한 판 같이 쳐요">
<meta property="og:description" content="초대 링크를 누르면 바로 방으로 들어와요 · 빈자리는 EV로 판단하는 AI">
<meta property="og:image" content="https://holdem.io.kr/icons/og-invite.jpg">
<meta property="og:url" content="https://holdem.io.kr/">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
         background: #140a0b; color: #efe6d4; font: 16px/1.7 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-align: center; }
  a { color: #e0bd75; font-weight: 600; }
</style>
</head>
<body>
<main>
  <p>헤즈업 홀덤이 새 주소로 이사했어요</p>
  <p><a id="go" href="https://holdem.io.kr/">holdem.io.kr로 가기</a></p>
</main>
<script>
// 이 주소(예전)의 저장 공간에 있던 전적·설정·손님 계정을 새 주소로 들고 간다 (#migrate=, 서버로는 보내지 않는 주소 조각)
// 예전 앱 캐시와 서비스 워커는 지운다. ?room= 같은 초대 코드는 그대로 넘긴다
(async () => {
  const NEW = 'https://holdem.io.kr/', KEEP = k => /^holdem\./.test(k) || k === 'sb-kxhmazdqgcfbjadgcczf-auth-token';
  const data = {};
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (KEEP(k)) data[k] = localStorage.getItem(k); } } catch {}
  try { if (!localStorage.getItem('holdem.movedId')) localStorage.setItem('holdem.movedId', crypto.randomUUID()); data['holdem.movedId'] = localStorage.getItem('holdem.movedId'); } catch {} // 같은 짐은 한 번만 더하게
  try { for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister(); } catch {}
  try { for (const k of await caches.keys()) await caches.delete(k); } catch {}
  const pack = Object.keys(data).length
    ? '#migrate=' + btoa(unescape(encodeURIComponent(JSON.stringify(data)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '') : '';
  const url = NEW + location.search + pack;
  document.getElementById('go').href = url;
  location.replace(url);
})();
</script>
</body>
</html>
